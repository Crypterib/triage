<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    Triage mark — three descending bars representing the funnel from
    raw inbound to the shortlist. Sharp corners, no symmetry, hand-tuned
    stroke weight. Designed to look like an editorial dingbat, not a
    stock icon.
  -->
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="4" y="6" width="24" height="3.2" fill="currentColor"/>
  <rect x="4" y="12.5" width="17" height="3.2" fill="currentColor"/>
  <rect x="4" y="19" width="9" height="3.2" fill="currentColor"/>
  <rect x="4" y="25.5" width="3" height="1.4" fill="currentColor"/>
</svg>
